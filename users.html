<body>
<div id="app"><div class="sh sq-on" aria-busy="true" aria-label="Loading"><aside class="sd"><div class="br"><i class="sq" style="--w:40px;--h:40px;--r:12px"></i><div style="display:grid;gap:7px"><i class="sq" style="--w:70px;--h:14px;--r:8px"></i><i class="sq" style="--w:92px;--h:10px;--r:8px"></i></div></div><nav class="sn"><div class="sg"><i class="sq" style="--w:70px;--h:10px;--r:5px"></i></div><div class="sq-a"><i class="sq" style="--w:20px;--h:20px;--r:6px"></i><i class="sq" style="--w:96px;--h:14px;--r:8px"></i></div><div class="sq-a"><i class="sq" style="--w:20px;--h:20px;--r:6px"></i><i class="sq" style="--w:96px;--h:14px;--r:8px"></i></div><div class="sq-a"><i class="sq" style="--w:20px;--h:20px;--r:6px"></i><i class="sq" style="--w:96px;--h:14px;--r:8px"></i></div><div class="sq-a"><i class="sq" style="--w:20px;--h:20px;--r:6px"></i><i class="sq" style="--w:96px;--h:14px;--r:8px"></i></div><div class="sg"><i class="sq" style="--w:70px;--h:10px;--r:5px"></i></div><div class="sq-a"><i class="sq" style="--w:20px;--h:20px;--r:6px"></i><i class="sq" style="--w:96px;--h:14px;--r:8px"></i></div></nav><div class="sf"><i class="sq" style="--w:100%;--h:44px;--r:12px"></i></div></aside><main class="mn"><header class="tb"><i class="sq" style="--w:40px;--h:40px;--r:12px"></i><i class="sq" style="--w:120px;--h:20px;--r:8px"></i><div class="srch2 sq-s"></div><div class="tr"><i class="sq" style="--w:64px;--h:40px;--r:12px"></i><i class="sq" style="--w:40px;--h:40px;--r:12px"></i><i class="sq" style="--w:40px;--h:40px;--r:12px"></i><i class="sq" style="--w:150px;--h:42px;--r:999px"></i></div></header><div id="vw"><div class="cd hero"><div style="min-width:0;flex:1;display:grid;gap:12px"><i class="sq" style="--w:min(380px,80%);--h:30px;--r:10px"></i><i class="sq" style="--w:min(520px,95%);--h:14px;--r:8px"></i><div class="acts" style="margin-top:6px"><i class="sq" style="--w:150px;--h:42px;--r:10px"></i><i class="sq" style="--w:140px;--h:42px;--r:10px"></i></div></div><div class="hr-r"><i class="sq" style="--w:150px;--h:150px;--r:50%"></i><i class="sq" style="--w:90px;--h:14px;--r:8px"></i></div></div><div class="tl"><div class="tile" style="pointer-events:none"><div class="th2"><i class="sq" style="--w:38px;--h:38px;--r:11px"></i></div><div class="tb2" style="display:grid;gap:7px"><i class="sq" style="--w:56px;--h:30px;--r:8px"></i><i class="sq" style="--w:110px;--h:13px;--r:8px"></i><i class="sq" style="--w:70px;--h:11px;--r:8px"></i></div></div><div class="tile" style="pointer-events:none"><div class="th2"><i class="sq" style="--w:38px;--h:38px;--r:11px"></i></div><div class="tb2" style="display:grid;gap:7px"><i class="sq" style="--w:56px;--h:30px;--r:8px"></i><i class="sq" style="--w:110px;--h:13px;--r:8px"></i><i class="sq" style="--w:70px;--h:11px;--r:8px"></i></div></div><div class="tile" style="pointer-events:none"><div class="th2"><i class="sq" style="--w:38px;--h:38px;--r:11px"></i></div><div class="tb2" style="display:grid;gap:7px"><i class="sq" style="--w:56px;--h:30px;--r:8px"></i><i class="sq" style="--w:110px;--h:13px;--r:8px"></i><i class="sq" style="--w:70px;--h:11px;--r:8px"></i></div></div><div class="tile" style="pointer-events:none"><div class="th2"><i class="sq" style="--w:38px;--h:38px;--r:11px"></i></div><div class="tb2" style="display:grid;gap:7px"><i class="sq" style="--w:56px;--h:30px;--r:8px"></i><i class="sq" style="--w:110px;--h:13px;--r:8px"></i><i class="sq" style="--w:70px;--h:11px;--r:8px"></i></div></div></div><div class="bento"><div class="cd c8"><i class="sq" style="--w:140px;--h:16px;--r:8px"></i><i class="sq" style="--w:60%;--h:18px;--r:8px; margin-top:16px"></i><i class="sq" style="--w:40%;--h:13px;--r:8px; margin-top:8px"></i><div style="display:flex;justify-content:space-between;margin-top:28px"><i class="sq" style="--w:44px;--h:44px;--r:50%"></i><i class="sq" style="--w:44px;--h:44px;--r:50%"></i><i class="sq" style="--w:44px;--h:44px;--r:50%"></i></div></div><div class="cd c4"><i class="sq" style="--w:140px;--h:16px;--r:8px"></i><i class="sq" style="--w:170px;--h:170px;--r:50%; margin:26px auto 0"></i></div></div></div></main></div></div>
<script src="panel.js?v=9"></script>
<script type="module">
import './fb.js?v=1';
const me = await FB.user();
if (!me) { location.replace('login.html'); throw 0 }
if (me.role === 'admin') { location.replace('admin.html'); throw 0 }
const uid = me.uid, D = { reqs: {}, msgs: {}, meta: {}, projects: {}, profile: { name: me.name, email: me.email } };
let ui = null, view = null;
const reqs = () => P.arr(D.reqs).sort((a, b) => b.t - a.t), mine = () => P.arr(D.projects).filter(p => p.ownerUid === uid).sort((a, b) => (b.created || 0) - (a.created || 0)), msgs = () => P.arr(D.msgs).sort((a, b) => a.t - b.t);
const unread = () => (D.meta && D.meta.unreadUser) || 0;
const refresh = () => { if (ui) { if (ui.bell) ui.bell(); ui.badge('chat', unread()); ui.badge('requests', reqs().filter(r => r.status !== 'Done').length) } if (view && view.update) view.update() };
FB.watch('requests/' + uid, v => { D.reqs = v || {}; refresh() });
FB.watch('threads/' + uid + '/msgs', v => { D.msgs = v || {}; refresh() });
FB.watch('threads/' + uid + '/meta', v => { D.meta = v || {}; refresh() });
FB.watch('projects', v => { D.projects = v || {}; refresh() });
FB.watch('users/' + uid, v => { if (v) D.profile = v; refresh() });

const NAV = [{ id: 'home', label: 'Overview', icon: 'home', g: 'Main' }, { id: 'projects', label: 'My projects', icon: 'folder' }, { id: 'requests', label: 'Requests', icon: 'list' }, { id: 'chat', label: 'Messages', icon: 'chat' }, { id: 'profile', label: 'Profile', icon: 'user', g: 'Account' }, { id: 'notifications', label: 'Notifications', icon: 'bell', hide: 1 }];
const kp = (ic, v, l, sub) => '<div class="cd kp"><div class="ib">' + P.ic(ic, 20) + '</div><div><b>' + v + '</b><span>' + l + '</span>' + (sub ? '<br><i>' + sub + '</i>' : '') + '</div></div>';
const bgc = s => s === 'Done' ? 'ok' : s === 'New' ? 'wn' : '';
const pcard = x => '<a class="pc" href="#projects/' + x.id + '"><div class="im">' + (x.image ? '<img src="' + x.image + '" alt="">' : P.ic('image', 28)) + '</div><h4>' + P.esc(x.title) + '</h4><p>' + P.esc(x.desc || '') + '</p></a>';

const events = () => {
  const e = [];
  msgs().forEach(m => { if (m.from === 'admin') e.push({ t: m.t, ic: 'chat', a: 'New reply from AB Tech', b: m.text.slice(0, 80), h: '#chat' }) });
  reqs().forEach(r => { if (r.upd) e.push({ t: r.upd, ic: 'list', a: 'Request update', b: r.title + ' · ' + r.status, h: '#requests' }) });
  mine().forEach(p => { if (p.created) e.push({ t: p.created, ic: 'folder', a: 'New project added', b: p.title, h: '#projects/' + p.id }) });
  return e.sort((a, b) => b.t - a.t).slice(0, 50)
};
const V = {};
function openReq(id) {
  const x = D.reqs[id]; if (!x) return;
  const st = ['New', 'In progress', 'Done'], i = st.indexOf(x.status);
  const m = P.modal('<div class="um-h"><span class="av">' + P.ic('list', 18) + '</span><div style="min-width:0"><b>' + P.esc(x.title) + '</b><small>' + P.esc(x.type) + ' &middot; ' + new Date(x.t).toLocaleDateString() + '</small></div><button class="gh x" data-x aria-label="Close">' + P.ic('x', 16) + '</button></div>' +
    '<div class="stp">' + st.map((s, k) => '<div class="' + (k <= i ? 'on' : '') + '"><i>' + (k < i ? P.ic('check', 14) : k + 1) + '</i>' + s + '</div>').join('') + '</div>' +
    '<div class="um-t">Details</div><div class="um-r" style="white-space:pre-wrap;overflow-wrap:anywhere">' + P.esc(x.details || '-') + '</div>' +
    '<div class="um-f"><a class="btn grow" href="#chat" id="gc">' + P.ic('chat', 15) + 'Message us</a></div>');
  P.$('#gc', m).onclick = () => m.close()
}
document.addEventListener('click', e => { const r = e.target.closest('[data-rq]'); if (r) openReq(r.dataset.rq); const h = e.target.closest('[data-h]'); if (h) location.hash = h.dataset.h.replace(/^#/, '') });

V.home = el => {
  const ST = ['New', 'In progress', 'Done'];
  const draw = () => {
    const r = reqs(), p = mine(), hr = new Date().getHours(), act = r.filter(x => x.status !== 'Done')[0], done = r.filter(x => x.status === 'Done').length, i = act ? ST.indexOf(act.status) : -1, ev = events().slice(0, 6);
    el.innerHTML = '<div class="cd hero"><div style="min-width:0"><h2>' + (hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening') + ', ' + P.esc((D.profile.name || '').split(' ')[0]) + '</h2><p class="mu" style="margin-top:4px">Follow your projects, send new requests and talk to the AB Tech team from here.</p><div class="acts"><a class="btn" href="#requests">' + P.ic('plus', 16) + 'New request</a><a class="btn sec" href="#chat">' + P.ic('chat', 16) + 'Message us</a></div></div><div class="hr-r">' + P.ring(r.length ? Math.round(100 * done / r.length) : 0) + '<span class="mu">Completed</span></div></div>' +
      '<div class="tl">' + P.tile('folder', p.length, 'My projects', '', '#projects') + P.tile('list', r.length, 'Requests', r.filter(x => x.status === 'In progress').length + ' in progress', '#requests') + P.tile('check', done, 'Completed', '', '#requests') + P.tile('chat', unread(), 'Unread replies', '', '#chat') + '</div>' +
      '<div class="bento"><div class="cd c8"><h3>' + P.ic('clock') + 'Current request</h3>' + (act ? '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div style="min-width:0"><b style="font-size:16px">' + P.esc(act.title) + '</b><div class="mu">' + P.esc(act.type) + ' &middot; ' + new Date(act.t).toLocaleDateString() + '</div></div><span class="bg ' + bgc(act.status) + '">' + P.esc(act.status) + '</span></div><div class="stp" style="margin-top:16px">' + ST.map((s, k) => '<div class="' + (k <= i ? 'on' : '') + '"><i>' + (k < i ? P.ic('check', 14) : k + 1) + '</i>' + s + '</div>').join('') + '</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn sec sm" data-rq="' + act.id + '">Details</button><a class="btn sm" href="#chat">Message us</a></div>' : '<div class="empty">' + P.ic('list', 32) + '<p style="margin:8px 0 14px">Nothing in progress right now.</p><a class="btn" href="#requests">New request</a></div>') + '</div>' +
      '<div class="cd c4"><h3>' + P.ic('list') + 'Requests by status</h3>' + P.donut(ST.map(s => ({ l: s, v: r.filter(x => x.status === s).length }))) + '</div>' +
      '<div class="cd c6"><h3>' + P.ic('folder') + 'Latest projects</h3>' + (p.length ? '<div class="pg">' + p.slice(0, 4).map(pcard).join('') + '</div>' : '<div class="empty">Your projects will appear here once we add them.</div>') + '</div>' +
      '<div class="cd c6"><h3>' + P.ic('pulse') + 'Activity</h3>' + (ev.map(x => '<div class="ev" data-h="' + x.h + '"><div class="ib">' + P.ic(x.ic, 16) + '</div><div><b>' + x.a + '</b><span>' + P.esc(x.b) + ' &middot; ' + P.ago(x.t) + '</span></div></div>').join('') || '<div class="empty">No notifications yet</div>') + '</div></div>'
  };
  draw(); view = { update: draw }; return () => view = null
};
V.notifications = el => { const d = P.notifPage(el); view = { update: d }; return () => view = null };

/* project viewer: opens inside the platform, the address is never shown or copyable */
function viewer(p) {
  if (!p) return; if (!p.url) return P.toast('This project is not online yet.', 1);
  P.openSite(p, 'Back')
}
V.projects = (el, sub) => {
  const draw = () => {
    if (sub) {
      const x = D.projects[sub];
      el.innerHTML = x && x.ownerUid === uid ? '<div class="cd pj pjd"><div class="im">' + (x.image ? '<img src="' + x.image + '" alt="">' : P.ic('image', 34)) + '</div><div class="bd2">' + (x.client ? '<small class="mu">' + P.esc(x.client) + '</small>' : '') + '<h4>' + P.esc(x.title) + '</h4><p>' + P.esc(x.desc || '') + '</p><div class="ac"><button class="btn" data-pv="' + x.id + '">' + P.ic('eye', 16) + 'Open project</button><a class="btn sec" href="#projects">' + P.ic('back', 16) + 'All projects</a></div></div></div>' : '<div class="cd empty">Project not found.</div>';
      return
    }
    const p = mine();
    el.innerHTML = p.length ? '<div class="ph"><h3>My projects</h3><span class="bg">' + p.length + '</span></div><div class="pg pg3">' + p.map(pcard).join('') + '</div>' : '<div class="cd empty">' + P.ic('folder', 36) + '<p style="margin-top:8px">No projects yet. Send a request and we will get started.</p><a class="btn" style="margin-top:14px" href="#requests">New request</a></div>'
  };
  el.onclick = e => { const b = e.target.closest('[data-pv]'); if (b) viewer(D.projects[b.dataset.pv]) };
  draw(); view = { update: draw }; return () => view = null
};
V.requests = el => {
  el.innerHTML = '<div class="g g2" style="align-items:start"><div class="cd"><h3>' + P.ic('plus') + 'New project request</h3><form class="fm" id="rf"><label class="f">Type<select id="ty"><option>Website</option><option>Web app / dashboard</option><option>Mobile app</option><option>Other</option></select></label><label class="f">Project title<input id="ti" required maxlength="80"></label><label class="f">Describe what you need<textarea id="de" required maxlength="1500"></textarea></label><div class="er" id="er"></div><button class="btn" id="sb">' + P.ic('send', 16) + 'Send request</button></form></div><div class="cd"><h3>' + P.ic('list') + 'My requests</h3><div id="rl"></div></div></div>';
  const draw = () => { const r = reqs(); P.$('#rl', el).innerHTML = r.length ? r.map(x => '<div class="ev" data-rq="' + x.id + '"><div class="ib">' + P.ic('list', 16) + '</div><div><b>' + P.esc(x.title) + '</b><span>' + P.esc(x.type) + ' &middot; ' + new Date(x.t).toLocaleDateString() + '</span></div><span class="bg ' + bgc(x.status) + '" style="margin-inline-start:auto">' + P.esc(x.status) + '</span></div>').join('') : '<div class="empty">No requests yet.</div>' };
  P.$('#rf', el).onsubmit = async e => {
    e.preventDefault(); const b = P.$('#sb', el); b.disabled = true;
    try { await FB.set('requests/' + uid + '/' + FB.key('requests/' + uid), { name: D.profile.name, email: D.profile.email, type: P.$('#ty', el).value, title: P.$('#ti', el).value.trim(), details: P.$('#de', el).value.trim(), status: 'New', t: Date.now() }); e.target.reset(); P.toast('Request sent. We will get back to you soon.') } catch (x) { P.$('#er', el).textContent = FB.err(x) }
    b.disabled = false
  };
  draw(); view = { update: draw }; return () => view = null
};
V.chat = el => {
  el.innerHTML = '<div class="ch in" style="grid-template-columns:1fr"><div class="cr"><div class="hd"><span class="av"><img src="icon-192.png" alt="" style="width:100%;height:100%;border-radius:50%" onerror="this.remove()"></span><div><b>AB Tech team</b><small>We usually reply within a day</small></div></div><div class="ms" id="ms"></div><form class="cb" id="cf"><textarea id="tx" rows="1" placeholder="Type a message"></textarea><button class="btn" aria-label="Send">' + P.ic('send', 18) + '</button></form></div></div>';
  const ms = P.$('#ms', el), tx = P.$('#tx', el); let n = -1;
  const draw = () => {
    const l = msgs(); if (l.length !== n) { ms.innerHTML = l.length ? P.bubbles(l, 'user') : '<div class="nochat">' + P.ic('chat', 40) + '<p>Say hello. Ask anything about your project.</p></div>'; ms.scrollTop = ms.scrollHeight; n = l.length }
    if (unread()) FB.set('threads/' + uid + '/meta/unreadUser', 0).catch(() => { })
  };
  const send = async () => {
    const v = tx.value.trim(); if (!v) return; tx.value = ''; tx.style.height = 'auto';
    try { const id = FB.key('threads/' + uid + '/msgs'); await FB.multi({ ['threads/' + uid + '/msgs/' + id]: { from: 'user', text: v, t: Date.now() }, ['threads/' + uid + '/meta/unreadAdmin']: FB.inc(1) }) } catch (e) { P.toast(FB.err(e), 1) }
  };
  P.$('#cf', el).onsubmit = e => { e.preventDefault(); send() };
  tx.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() } };
  tx.oninput = () => { tx.style.height = 'auto'; tx.style.height = Math.min(130, tx.scrollHeight) + 'px' };
  draw(); tx.focus(); view = { update: draw }; return () => view = null
};
V.profile = el => {
  el.innerHTML = '<div class="g g2" style="align-items:start"><div class="cd"><h3>' + P.ic('user') + 'My details</h3><form class="fm" id="pf"><label class="f">Full name<input id="nm" value="' + P.esc(D.profile.name || '') + '" required maxlength="80"></label><label class="f">Email<input value="' + P.esc(me.email) + '" disabled></label><div class="er" id="e1"></div><button class="btn">Save</button></form></div>' +
    '<div class="cd"><h3>' + P.ic('key') + 'Change password</h3><form class="fm" id="pw"><label class="f">Current password<input type="password" id="op" autocomplete="current-password" required></label><label class="f">New password<input type="password" id="np" minlength="6" autocomplete="new-password" required></label><div class="er" id="e2"></div><button class="btn">Update password</button></form></div></div>';
  P.$('#pf', el).onsubmit = async e => { e.preventDefault(); try { await FB.update('users/' + uid, { name: P.$('#nm', el).value.trim() }); P.toast('Saved') } catch (x) { P.$('#e1', el).textContent = FB.err(x) } };
  P.$('#pw', el).onsubmit = async e => { e.preventDefault(); const er = P.$('#e2', el); er.textContent = ''; try { await FB.changePass(P.$('#op', el).value, P.$('#np', el).value); e.target.reset(); P.toast('Password updated') } catch (x) { er.textContent = FB.err(x) } }
};
ui = P.shell({ brand: 'Client area', nav: NAV, user: me, render: (id, el, sub) => V[id](el, sub), subTitle: (id, sub) => id === 'projects' && D.projects[sub] ? D.projects[sub].title : '' , profile: 'profile', events, search: q => { const o = []; mine().filter(x => (x.title + ' ' + (x.desc || '')).toLowerCase().includes(q)).slice(0, 4).forEach(x => o.push({ ic: 'folder', t: x.title, s: x.desc || '', h: '#projects/' + x.id })); reqs().filter(x => x.title.toLowerCase().includes(q)).slice(0, 4).forEach(x => o.push({ ic: 'list', t: x.title, s: x.type, fn: () => openReq(x.id) })); return o } });
refresh();
</script>
</body>
</html>
