1px;--r:8px"></i></div></div><div class="tile" style="pointer-events:none"><div class="th2"><i class="sq" style="--w:38px;--h:38px;--r:11px"></i></div><div class="tb2" style="display:grid;gap:7px"><i class="sq" style="--w:56px;--h:30px;--r:8px"></i><i class="sq" style="--w:110px;--h:13px;--r:8px"></i><i class="sq" style="--w:70px;--h:11px;--r:8px"></i></div></div><div class="tile" style="pointer-events:none"><div class="th2"><i class="sq" style="--w:38px;--h:38px;--r:11px"></i></div><div class="tb2" style="display:grid;gap:7px"><i class="sq" style="--w:56px;--h:30px;--r:8px"></i><i class="sq" style="--w:110px;--h:13px;--r:8px"></i><i class="sq" style="--w:70px;--h:11px;--r:8px"></i></div></div><div class="tile" style="pointer-events:none"><div class="th2"><i class="sq" style="--w:38px;--h:38px;--r:11px"></i></div><div class="tb2" style="display:grid;gap:7px"><i class="sq" style="--w:56px;--h:30px;--r:8px"></i><i class="sq" style="--w:110px;--h:13px;--r:8px"></i><i class="sq" style="--w:70px;--h:11px;--r:8px"></i></div></div><div class="tile add" style="pointer-events:none"><i class="sq" style="--w:22px;--h:22px;--r:6px"></i><i class="sq" style="--w:110px;--h:13px;--r:8px"></i></div></div><div class="bento"><div class="cd c8"><i class="sq" style="--w:140px;--h:16px;--r:8px"></i><i class="sq" style="--w:100%;--h:230px;--r:14px; margin-top:16px"></i></div><div class="cd c4"><i class="sq" style="--w:140px;--h:16px;--r:8px"></i><i class="sq" style="--w:170px;--h:170px;--r:50%; margin:26px auto 0"></i></div></div></div></main></div></div>
<script src="panel.js?v=9"></script>
<script type="module">
import './fb.js?v=1';
const me = await FB.user();
let em = null; if (me && me.role === 'admin') { try { em = await FB.get('settings/emailjs') } catch (e) { } }
const needCode = em && em.enabled && em.service && em.template && em.key;
if (!me || me.role !== 'admin' || (needCode && sessionStorage.getItem('ab_admin') !== me.uid)) { if (me && me.role !== 'admin') location.replace('users.html'); else location.replace('login.html'); throw 0 }

/* live data */
const D = { users: {}, reqs: {}, threads: {}, inbox: {}, projects: {}, stats: {}, counters: null, emailjs: em || {} };
let ui = null, view = null;
const refresh = () => { badges(); if (view && view.update) view.update() };
function badges() {
  if (!ui) return;
  ui.badge('messages', unreadAll()); ui.badge('requests', reqList().filter(r => r.status === 'New').length); ui.badge('users', P.arr(D.users).filter(u => Date.now() - (u.created || 0) < 864e5).length); if (ui.bell) ui.bell()
}
const unreadAll = () => P.arr(D.threads).reduce((a, t) => a + ((t.meta && t.meta.unreadAdmin) || 0), 0) + P.arr(D.inbox).filter(m => !m.read).length;
const reqList = () => { const a = []; Object.keys(D.reqs || {}).forEach(u => P.arr(D.reqs[u]).forEach(r => a.push(Object.assign({ uid: u }, r)))); return a.sort((x, y) => y.t - x.t) };
const days = n => P.days(n);
const sday = (d, k) => ((D.stats.days || {})[d] || {})[k] || 0;
const tot = k => (D.stats.total || {})[k] || 0;
['users', 'requests:reqs', 'threads', 'inbox', 'projects', 'stats', 'site/counters:counters'].forEach(s => { const [p, k] = s.split(':'); FB.watch(p, v => { D[k || p] = v || (k === 'counters' ? null : {}); refresh() }) });

const NAV = [{ id: 'overview', label: 'Overview', icon: 'home', g: 'Main' }, { id: 'requests', label: 'Requests', icon: 'list' }, { id: 'messages', label: 'Messages', icon: 'chat' }, { id: 'users', label: 'Users', icon: 'users', g: 'Manage' }, { id: 'projects', label: 'Projects', icon: 'folder' }, { id: 'homepage', label: 'Homepage', icon: 'globe' }, { id: 'dashboards', label: 'Dashboards', icon: 'grid', g: 'System' }, { id: 'settings', label: 'Settings', icon: 'gear' }, { id: 'notifications', label: 'Notifications', icon: 'bell', hide: 1 }];
const kp = (ic, v, l, sub) => '<div class="cd kp"><div class="ib">' + P.ic(ic, 20) + '</div><div><b>' + v + '</b><span>' + l + '</span>' + (sub ? '<br><i>' + sub + '</i>' : '') + '</div></div>';
const uname = id => (D.users[id] && D.users[id].name) || 'Unknown user';

/* ---------- suggestions for the admin ---------- */
function tips() {
  const t = [], u = P.arr(D.users), rq = reqList(), nw = rq.filter(r => r.status === 'New'), un = unreadAll();
  const d7 = days(7), d14 = days(14), v7 = d7.reduce((a, d) => a + sday(d, 'visits'), 0), vp = d14.slice(0, 7).reduce((a, d) => a + sday(d, 'visits'), 0);
  if (un) t.push(['Unanswered messages', un + ' conversation' + (un > 1 ? 's' : '') + ' waiting for your reply. Fast replies convert visitors into clients.']);
  if (nw.length) t.push(['New project requests', nw.length + ' request' + (nw.length > 1 ? 's are' : ' is') + ' still marked New. Move them to In progress once you start.']);
  if (vp && v7 < vp * .8) t.push(['Visits are down', 'Visits fell ' + Math.round(100 - 100 * v7 / vp) + '% compared with the previous 7 days. Share the site or a new project on social media.']);
  if (vp && v7 > vp * 1.2) t.push(['Visits are growing', 'Visits are up ' + Math.round(100 * v7 / vp - 100) + '% versus the previous 7 days. A good moment to publish a new project.']);
  const nop = u.filter(x => !P.arr(D.projects).some(p => p.ownerUid === x.id));
  if (nop.length) t.push(['Clients without a project', nop.length + ' registered user' + (nop.length > 1 ? 's have' : ' has') + ' no project yet. Add one from Projects so they see it in their dashboard.']);
  if (tot('visits') > 20 && u.length / tot('visits') < .05) t.push(['Low sign-up rate', 'Only ' + (100 * u.length / tot('visits')).toFixed(1) + '% of visits became accounts. Make the sign-up call to action clearer on the homepage.']);
  if (!D.counters) t.push(['Homepage counters', 'The counters still show default values. Set your real numbers in Homepage counters.']);
  if (!needCode) t.push(['Secure admin login', 'Add your EmailJS keys in Settings so every admin login needs a code sent to your email.']);
  if (!t.length) t.push(['All clear', 'Nothing needs attention right now.']);
  return t
}
const tipsHtml = () => tips().map(x => '<div class="tip">' + P.ic('bulb') + '<div><b>' + P.esc(x[0]) + '</b><span>' + P.esc(x[1]) + '</span></div></div>').join('');
function activity(n) {
  const e = [];
  P.arr(D.users).forEach(u => e.push({ t: u.created, i: 'user', a: u.name + ' created an account', b: u.email }));
  reqList().forEach(r => e.push({ t: r.t, i: 'folder', a: r.name + ' sent a request', b: r.title }));
  P.arr(D.inbox).forEach(m => e.push({ t: m.t, i: 'mail', a: m.name + ' wrote from the website', b: m.text.slice(0, 70) }));
  return e.filter(x => x.t).sort((a, b) => b.t - a.t).slice(0, n).map(x => '<div class="ev"><div class="ib">' + P.ic(x.i, 16) + '</div><div><b>' + P.esc(x.a) + '</b><span>' + P.esc(x.b) + ' &middot; ' + P.ago(x.t) + '</span></div></div>').join('') || '<div class="empty">No activity yet</div>'
}


/* ---------- notifications: built from live data, nothing extra to store ---------- */
function events() {
  const e = [];
  P.arr(D.users).forEach(u => { if (u.created) e.push({ t: u.created, ic: 'user', a: 'New sign-up', b: u.name + ' · ' + u.email, fn: () => userModal(u.id) }); if (u.lastLogin && u.lastLogin !== u.created) e.push({ t: u.lastLogin, ic: 'key', a: 'Login', b: u.name, fn: () => userModal(u.id) }) });
  reqList().forEach(r => e.push({ t: r.t, ic: 'folder', a: 'New project request', b: r.name + ' · ' + r.title, fn: () => reqModal(r.uid + '/' + r.id) }));
  Object.keys(D.threads || {}).forEach(id => { const m = P.arr((D.threads[id] || {}).msgs).filter(x => x.from === 'user').sort((a, b) => b.t - a.t)[0]; if (m) e.push({ t: m.t, ic: 'chat', a: 'New message', b: uname(id) + ': ' + m.text.slice(0, 60), fn: () => { chatSel = 'u:' + id }, h: 'messages' }) });
  P.arr(D.inbox).forEach(m => e.push({ t: m.t, ic: 'mail', a: 'Website message', b: (m.name || '') + ': ' + (m.text || '').slice(0, 60), fn: () => { chatSel = 'g:' + m.id }, h: 'messages' }));
  return e.filter(x => x.t).sort((a, b) => b.t - a.t).slice(0, 60)
}
function exportCsv(n) {
  const rows = ['date,visits,unique,logins'].concat(days(n).map(d => [d, sday(d, 'visits'), sday(d, 'unique'), sday(d, 'logins')].join(',')));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv' })); a.download = 'ab-tech-stats-' + FB.today() + '.csv'; document.body.appendChild(a); a.click(); a.remove()
}

/* ---------- views ---------- */
const V = {};
V.overview = (el, sub) => {
  if (sub) return detail(el, sub);
  let per = 14;
  const sum = (a, k) => a.reduce((t, x) => t + sday(x, k), 0), dl = k => { const a = days(per * 2), c = sum(a.slice(per), k), p = sum(a.slice(0, per), k); return p ? Math.round(100 * (c - p) / p) : (c ? 100 : 0) };
  const perDay = (arr, f) => days(per).map(d => arr.filter(x => f(x) && new Date(f(x)).toISOString().slice(0, 10) === d).length);
  const draw = () => {
    const d = days(per), td = FB.today(), u = P.arr(D.users), rq = reqList(), pj = P.arr(D.projects), hr = new Date().getHours(), nw = rq.filter(r => r.status === 'New').length, un = unreadAll(), vs = x => sday(x, 'visits');
    const T = [['eye', 'visits', tot('visits'), 'Website visits', sday(td, 'visits') + ' today', { spark: d.map(vs), d: dl('visits') }], ['globe', 'unique', tot('unique'), 'Unique visitors', sday(td, 'unique') + ' today', { spark: d.map(x => sday(x, 'unique')), d: dl('unique') }], ['users', 'users', u.length, 'Registered users', (tot('signups') || u.length) + ' sign-ups', { spark: perDay(u, x => x.created) }], ['key', 'logins', tot('logins'), 'Logins', sday(td, 'logins') + ' today', { spark: d.map(x => sday(x, 'logins')), d: dl('logins') }], ['folder', 'requests', rq.length, 'Project requests', nw + ' new', { spark: perDay(rq, x => x.t) }], ['chat', 'messages', un, 'Unread messages', P.arr(D.inbox).length + ' from website'], ['image', 'projects', pj.length, 'Projects', pj.filter(p => p.home !== false).length + ' on the homepage']];
    const ST = ['New', 'In progress', 'Done'], first = (me.name || 'Admin').split(' ')[0];
    el.innerHTML = '<div class="ph"><div><h2>' + (hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening') + ', ' + P.esc(first) + '</h2><p class="mu">' + new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }) + '</p></div><div class="phr"><div class="chs">' + [7, 14, 30].map(n => '<button class="gh' + (n === per ? ' on' : '') + '" data-per="' + n + '">' + n + 'D</button>').join('') + '</div><button class="btn sec" id="ex">' + P.ic('down', 16) + 'Export CSV</button></div></div>' +
      (nw || un ? '<div class="al">' + (nw ? '<a href="#requests"><b>' + nw + '</b><span>New requests</span></a>' : '') + (un ? '<a href="#messages"><b>' + un + '</b><span>Unread messages</span></a>' : '') + '</div>' : '') +
      '<div class="tl">' + T.map(x => P.tile(x[0], x[2], x[3], x[4], '#overview/' + x[1], x[5])).join('') + '<button class="tile add" data-add>' + P.ic('plus', 22) + '<span>Add to homepage</span></button></div>' +
      '<div class="bento"><div class="cd c8"><h3>' + P.ic('pulse') + 'Visits</h3>' + P.line(d, [{ n: 'Visits', v: d.map(vs) }, { n: 'Unique visitors', v: d.map(x => sday(x, 'unique')) }], 210) + '</div>' +
      '<div class="cd c4"><h3>' + P.ic('list') + 'Requests by status</h3>' + P.donut(ST.map(x => ({ l: x, v: rq.filter(r => r.status === x).length }))) + '</div>' +
      '<div class="cd c8"><h3>' + P.ic('folder') + 'Recent requests</h3><div class="ls2 cols">' + (rq.slice(0, 4).map(rqRow).join('') || '<div class="empty">No requests yet.</div>') + '</div></div>' +
      '<div class="cd c4"><h3>' + P.ic('globe') + 'Traffic</h3>' + P.donut([{ l: 'Unique visitors', v: tot('unique') }, { l: 'Returning visits', v: Math.max(0, tot('visits') - tot('unique')) }]) + '</div>' +
      '<div class="cd c4"><h3>' + P.ic('clock') + 'Recent activity</h3>' + activity(7) + '</div>' +
      '<div class="cd c4"><h3>' + P.ic('users') + 'Newest users</h3>' + (u.slice().sort((a, b) => (b.created || 0) - (a.created || 0)).slice(0, 6).map(x => '<div class="ev" data-u="' + x.id + '"><div class="av">' + P.esc(P.init(x.name)) + '</div><div><b>' + P.esc(x.name) + '</b><span>' + P.esc(x.email) + ' &middot; ' + P.ago(x.created) + '</span></div></div>').join('') || '<div class="empty">No users yet</div>') + '</div>' +
      '<div class="cd c4"><h3>' + P.ic('bulb') + 'Needs attention</h3>' + tipsHtml() + '</div></div>'
  };
  el.onclick = e => { if (e.target.closest('[data-add]')) return projectModal(); const pc = e.target.closest('[data-per]'); if (pc) { per = +pc.dataset.per; P.replay(); return draw() } if (e.target.closest('#ex')) return exportCsv(per); const u = e.target.closest('[data-u]'); if (u) userModal(u.dataset.u) };
  draw(); view = { update: draw }; return () => view = null
};
V.notifications = el => { const d = P.notifPage(el); view = { update: d }; return () => view = null };

/* overview tiles open these detail pages */
const pRow = x => '<div class="lr" data-p="' + x.id + '"><div class="th">' + (x.image ? '<img src="' + x.image + '" alt="">' : P.ic('image', 18)) + '</div><div class="tx"><b>' + P.esc(x.title) + '</b><small>' + (x.ownerUid ? P.esc(uname(x.ownerUid)) : P.t('Homepage only')) + '</small></div>' + (x.vis === 'private' ? '<span class="bg" title="Private">' + P.ic('shield', 12) + '</span>' : '') + (x.home === false ? '<span class="bg">Hidden</span>' : '<span class="bg ok">' + P.ic('globe', 12) + '</span>') + '</div>';
function pSheet(id) {
  const x = D.projects[id]; if (!x) return;
  const m = P.modal('<h3>' + P.esc(x.title) + '<button class="gh x" data-x aria-label="Close">' + P.ic('x', 16) + '</button></h3><div style="aspect-ratio:16/9;border-radius:12px;background:var(--sf2);overflow:hidden;display:grid;place-items:center;margin-bottom:12px">' + (x.image ? '<img src="' + x.image + '" style="width:100%;height:100%;object-fit:cover" alt="">' : P.ic('image', 34)) + '</div><p class="mu">' + P.esc(x.desc || '') + '</p><p style="margin-top:8px"><small class="mu">Client</small> <b>' + (x.ownerUid ? P.esc(uname(x.ownerUid)) : 'Homepage only') + '</b></p><p style="margin-top:4px"><small class="mu">Visibility</small> <b>' + (x.vis === 'private' ? 'Private' : 'Public') + '</b></p>' +
    '<div class="ft"><button class="btn dng" id="dl">' + P.ic('trash', 15) + 'Delete</button><button class="btn sec" id="pv">' + P.ic('eye', 15) + 'Preview</button><button class="btn sec" id="tg">' + P.ic('globe', 15) + (x.home === false ? 'Show on homepage' : 'Hide from homepage') + '</button><button class="btn" id="ed">' + P.ic('edit', 15) + 'Edit</button></div>');
  P.$('#pv', m).onclick = () => viewer(x); P.$('#ed', m).onclick = () => { m.close(); projectModal(x) };
  P.$('#tg', m).onclick = () => FB.set('projects/' + id + '/home', x.home === false).then(() => { m.close(); P.toast('Saved') }).catch(e => P.toast(FB.err(e), 1));
  P.$('#dl', m).onclick = async () => { m.close(); if (await P.confirm('Delete project', 'It will disappear from the homepage and from the client dashboard.', 'Delete')) FB.remove('projects/' + id).then(() => P.toast('Project deleted')) }
}
const detail = (el, k) => {
  const LB = { visits: 'Website visits', unique: 'Unique visitors', logins: 'Logins' };

        const keep = shown && shown.split(':')[1] === uid && P.$('#tx', cr) ? P.$('#tx', cr).value : '';
        cr.innerHTML = '<div class="hd"><button class="gh bk" id="bk">' + P.ic('back', 16) + '</button><span class="av">' + P.esc(P.init(c.n)) + '</span><div><b>' + P.esc(c.n) + '</b><small>' + P.esc(c.e) + '</small></div></div><div class="ms" id="ms">' + P.bubbles(c.ms, 'admin') + '</div><form class="cb" id="cf"><textarea id="tx" rows="1" placeholder="Type a message"></textarea><button class="btn" aria-label="Send">' + P.ic('send', 18) + '</button></form>';
        const ms = P.$('#ms', cr); ms.scrollTop = ms.scrollHeight; const tx = P.$('#tx', cr); tx.value = keep; if (keep) tx.focus(); shown = sig;
        const send = async () => {
          const v = tx.value.trim(); if (!v) return; tx.value = '';
          try { const id = FB.key('threads/' + uid + '/msgs'); await FB.multi({ ['threads/' + uid + '/msgs/' + id]: { from: 'admin', text: v, t: Date.now() }, ['threads/' + uid + '/meta/unreadUser']: FB.inc(1), ['threads/' + uid + '/meta/unreadAdmin']: 0 }) } catch (e) { P.toast(FB.err(e), 1) }
        };
        P.$('#cf', cr).onsubmit = e => { e.preventDefault(); send() };
        tx.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() } };
        tx.oninput = () => { tx.style.height = 'auto'; tx.style.height = Math.min(130, tx.scrollHeight) + 'px' };
      }
      if (c.un) FB.set('threads/' + uid + '/meta/unreadAdmin', 0)
    }
    const bk = P.$('#bk', cr); if (bk) bk.onclick = () => { chatSel = null; shown = null; drawList(); drawChat() }
  };
  P.$('#q', el).oninput = e => { q = e.target.value.toLowerCase(); drawList() };
  P.$('#ls', el).onclick = e => { const c = e.target.closest('[data-k]'); if (c) { chatSel = c.dataset.k; shown = null; drawList(); drawChat() } };
  drawList(); drawChat(); view = { update: () => { drawList(); drawChat() } }; return () => { view = null }
};

/* projects */
V.projects = el => {
  let q = '', f = 'all', lim = 30;
  el.innerHTML = '<div class="sec-h" style="margin-top:0"><div class="srch">' + P.ic('search', 16) + '<input id="q" placeholder="Search"></div><select id="f" style="width:auto"><option value="all">All</option><option value="home">On the homepage</option><option value="hid">Hidden</option><option value="cl">Client projects</option></select><div class="sp"><button class="btn" id="np">' + P.ic('plus', 16) + 'New project</button></div></div><div id="pl"></div>';
  const draw = () => {
    const p = P.arr(D.projects).filter(x => (x.title + ' ' + (x.desc || '') + ' ' + (x.ownerUid ? uname(x.ownerUid) : '')).toLowerCase().includes(q) && (f === 'all' || (f === 'home' && x.home !== false) || (f === 'hid' && x.home === false) || (f === 'cl' && x.ownerUid))).sort((a, b) => (b.created || 0) - (a.created || 0));
    P.$('#pl', el).innerHTML = (p.length ? '<div class="ls2 cols">' + p.slice(0, lim).map(pRow).join('') + '</div>' + (p.length > lim ? '<div style="text-align:center;margin-top:12px"><button class="btn sec" id="mo">Show more</button></div>' : '') : '<div class="cd empty">No projects yet. Add the first one and it will appear on the homepage automatically.</div>')
  };
  P.$('#q', el).oninput = e => { q = e.target.value.toLowerCase(); lim = 30; draw() }; P.$('#f', el).onchange = e => { f = e.target.value; lim = 30; draw() };
  el.onclick = e => { const p = e.target.closest('[data-p]'); if (p) return pSheet(p.dataset.p); if (e.target.closest('#np')) projectModal(); if (e.target.closest('#mo')) { lim += 30; draw() } };
  draw(); view = { update: draw }; return () => view = null
};
/* homepage: projects shown on the website + counters */
V.homepage = el => {
  el.innerHTML = '<div id="hp"></div><div class="sec-h"><h2>Homepage counters</h2></div><div id="cn"></div>';
  const draw = () => {
    const all = P.arr(D.projects), on = all.filter(p => p.home !== false).sort((a, b) => (b.created || 0) - (a.created || 0)), off = all.filter(p => p.home === false);
    P.$('#hp', el).innerHTML = '<div class="sec-h" style="margin-top:0"><h2>Projects on the homepage</h2><div class="sp"><button class="btn" id="ah">' + P.ic('plus', 16) + 'Add new project</button></div></div>' +
      (off.length ? '<div class="cd" style="margin-bottom:12px"><label class="f">Add an existing project<select id="ex"><option value="">Choose a project</option>' + off.map(x => '<option value="' + x.id + '">' + P.esc(x.title) + '</option>').join('') + '</select></label></div>' : '') +
      (on.length ? '<div class="ls2 cols">' + on.map(pRow).join('') + '</div>' : '<div class="cd empty">No projects on the homepage yet.</div>')
  };
  el.onclick = e => { const p = e.target.closest('[data-p]'); if (p) pSheet(p.dataset.p); else if (e.target.closest('#ah')) projectModal() };
  el.onchange = e => { if (e.target.id === 'ex' && e.target.value) FB.set('projects/' + e.target.value + '/home', true).then(() => P.toast('Saved')).catch(x => P.toast(FB.err(x), 1)) };
  counters(P.$('#cn', el)); draw(); view = { update: draw }; return () => view = null
};
function viewer(p) {
  if (!p || !p.url) return P.toast('This project has no link.', 1);
  P.openSite(p, 'Close')
}
function projectModal(p, ownerId) {
  p = p || {}; const us = P.arr(D.users); let img = p.image || '';
  const m = P.modal('<h3>' + (p.id ? 'Edit project' : 'New project') + '<button class="gh x" data-x aria-label="Close">' + P.ic('x', 16) + '</button></h3><form class="fm" id="pf">' +
    '<label class="f">Client (who sees it in their dashboard)<select id="ow"><option value="">Homepage only (no client)</option>' + us.map(u => '<option value="' + u.id + '"' + ((p.ownerUid || ownerId) === u.id ? ' selected' : '') + '>' + P.esc(u.name) + ' - ' + P.esc(u.email) + '</option>').join('') + '</select></label>' +
    '<label class="f">Title<input id="ti" value="' + P.esc(p.title || '') + '" required maxlength="80"></label><label class="f">Description<textarea id="de" maxlength="600">' + P.esc(p.desc || '') + '</textarea></label>' +
    '<label class="f">Project or website link<input id="ur" type="url" placeholder="https://" value="' + P.esc(p.url || '') + '"></label>' +
    '<div class="f"><span>Project image</span><div style="display:flex;gap:12px;align-items:center;margin-top:6px"><div class="im" id="pv" style="width:120px;aspect-ratio:16/9;border-radius:10px;background:var(--sf2);overflow:hidden;display:grid;place-items:center">' + (img ? '<img src="' + img + '" style="width:100%;height:100%;object-fit:cover">' : P.ic('image', 26)) + '</div><label class="btn sec" style="cursor:pointer">' + P.ic('plus', 15) + 'Upload<input id="fi" type="file" accept="image/*" hidden></label></div></div>' +
    '<div class="row"><label class="f">Visibility<select id="vi"><option value="public"' + (p.vis === 'private' ? '' : ' selected') + '>Public (visitors can open it)</option><option value="private"' + (p.vis === 'private' ? ' selected' : '') + '>Private (shown, but nobody can open it)</option></select></label><label class="f">Client name (shown on the website)<input id="cn2" maxlength="60" value="' + P.esc(p.client || '') + '"></label></div><label class="f">Features (separated by commas)<input id="tg2" maxlength="200" value="' + P.esc(p.tags || '') + '"></label><label class="tg"><input id="hm" type="checkbox"' + (p.home === false ? '' : ' checked') + '>Show on the homepage</label><div class="er" id="er"></div>' +
    '<div class="ft"><button type="button" class="btn sec" data-x>Cancel</button><button class="btn" id="sv">Save project</button></div></form>');
  P.$('#fi', m).onchange = async e => { const f = e.target.files[0]; if (!f) return; try { img = await P.img(f, 1200, .82); P.$('#pv', m).innerHTML = '<img src="' + img + '" style="width:100%;height:100%;object-fit:cover">' } catch (x) { P.$('#er', m).textContent = 'Could not read this image.' } };
  P.$('#pf', m).onsubmit = async e => {
    e.preventDefault(); const b = P.$('#sv', m); b.disabled = true;
    const ul = P.$('#ur', m).value.trim(); if (ul && !/^https?:\/\//i.test(ul)) { P.$('#er', m).textContent = 'Enter a link that starts with https://'; b.disabled = false; return }
    const id = p.id || FB.key('projects'), o = { vis: P.$('#vi', m).value, client: P.$('#cn2', m).value.trim(), tags: P.$('#tg2', m).value.trim(), title: P.$('#ti', m).value.trim(), desc: P.$('#de', m).value.trim(), url: P.$('#ur', m).value.trim(), image: img, ownerUid: P.$('#ow', m).value, home: P.$('#hm', m).checked, created: p.created || Date.now() };
    try { await FB.set('projects/' + id, o); m.close(); P.toast('Project saved') } catch (x) { P.$('#er', m).textContent = FB.err(x); b.disabled = false }
  }
}

/* homepage counters */
const counters = el => {
  const def = [{ value: 2, suffix: '', label: 'Years of experience', desc: '' }, { value: 2, suffix: '', label: 'Projects built', desc: '' }, { value: 24, suffix: 'h', label: 'Usual reply time', desc: '' }, { value: 3, suffix: '', label: 'Languages', desc: '' }];
  const cur = () => { const c = D.counters; const l = c ? (Array.isArray(c) ? c : Object.keys(c).sort().map(k => c[k])) : []; return def.map((d, i) => Object.assign({}, d, l[i] || {})) };
  const c = cur(), ics = ['clock', 'globe', 'chat', 'globe'];
  el.innerHTML = '<p class="mu" style="margin-bottom:14px">These four numbers appear on the homepage and count up from 0 when a visitor scrolls to them.</p><form id="cf" class="g g2">' + c.map((x, i) => '<div class="cd fm"><h3>Counter ' + (i + 1) + '</h3><div class="row"><label class="f">Number<input type="number" min="0" data-f="value" data-i="' + i + '" value="' + x.value + '"></label><label class="f">After the number (h, +, %)<input data-f="suffix" data-i="' + i + '" value="' + P.esc(x.suffix || '') + '" maxlength="3"></label></div><label class="f">Title<input data-f="label" data-i="' + i + '" value="' + P.esc(x.label) + '" maxlength="40"></label><label class="f">Short description<textarea data-f="desc" data-i="' + i + '" maxlength="140" style="min-height:70px">' + P.esc(x.desc || '') + '</textarea></label></div>').join('') + '<div style="grid-column:1/-1"><button class="btn">' + P.ic('check', 16) + 'Save counters</button></div></form>';
  P.$('#cf', el).onsubmit = async e => {
    e.preventDefault(); const o = {}; P.$$('[data-f]', el).forEach(i => { (o[i.dataset.i] = o[i.dataset.i] || {})[i.dataset.f] = i.dataset.f === 'value' ? Math.max(0, +i.value || 0) : i.value.trim() });
    const arr = [0, 1, 2, 3].map(i => o[i]); try { await FB.set('site/counters', arr); P.toast('Counters saved. The homepage updates instantly.') } catch (x) { P.toast(FB.err(x), 1) }
  }
};

/* settings */
V.settings = el => {
  const ej = D.emailjs || {};
  el.innerHTML = '<div class="g g2"><div class="cd"><h3>' + P.ic('key') + 'Change password</h3><form class="fm" id="pw"><label class="f">Current password<input type="password" id="op" autocomplete="current-password" required></label><label class="f">New password<input type="password" id="np" minlength="6" autocomplete="new-password" required></label><div class="er" id="e1"></div><button class="btn">Update password</button></form></div>' +
    '<div class="cd"><h3>' + P.ic('mail') + 'Change login email</h3><p class="mu" style="margin-bottom:10px">Current: ' + P.esc(me.email) + '. Firebase sends a confirmation link to the new address; the change applies after you click it.</p><form class="fm" id="ml"><label class="f">Current password<input type="password" id="op2" autocomplete="current-password" required></label><label class="f">New email<input type="email" id="ne" required></label><div class="er" id="e2"></div><button class="btn">Send confirmation</button></form></div></div>' +
    '<div class="cd" style="margin-top:14px"><h3>' + P.ic('shield') + 'Admin login code (EmailJS)</h3><p class="mu" style="margin-bottom:12px">When enabled, every admin login asks for a 6-digit code sent to your email. In EmailJS, create a template that sends to <code>{{to_email}}</code> and shows <code>{{code}}</code>.</p><form class="fm" id="ej"><div class="row"><label class="f">Service ID<input id="sv" value="' + P.esc(ej.service || '') + '"></label><label class="f">Template ID<input id="tp" value="' + P.esc(ej.template || '') + '"></label></div><label class="f">Public key<input id="ky" value="' + P.esc(ej.key || '') + '"></label><label class="tg"><input type="checkbox" id="en"' + (ej.enabled ? ' checked' : '') + '>Require the email code on admin login</label><div class="er" id="e3"></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn">Save</button><button type="button" class="btn sec" id="ts">' + P.ic('send', 15) + 'Send test code</button></div></form></div>' +
    '<div class="cd" style="margin-top:14px"><h3>' + P.ic('users') + 'Account</h3><p class="mu">You are signed in as ' + P.esc(me.email) + '. Your user id: <code>' + P.esc(me.uid) + '</code></p></div>';
  P.$('#pw', el).onsubmit = async e => { e.preventDefault(); const er = P.$('#e1', el); er.textContent = ''; try { await FB.changePass(P.$('#op', el).value, P.$('#np', el).value); e.target.reset(); P.toast('Password updated') } catch (x) { er.textContent = FB.err(x) } };
  P.$('#ml', el).onsubmit = async e => { e.preventDefault(); const er = P.$('#e2', el); er.textContent = ''; try { await FB.changeEmail(P.$('#op2', el).value, P.$('#ne', el).value.trim()); e.target.reset(); P.toast('Confirmation email sent') } catch (x) { er.textContent = FB.err(x) } };
  const read = () => ({ service: P.$('#sv', el).value.trim(), template: P.$('#tp', el).value.trim(), key: P.$('#ky', el).value.trim(), enabled: P.$('#en', el).checked });
  P.$('#ej', el).onsubmit = async e => { e.preventDefault(); try { await FB.set('settings/emailjs', read()); D.emailjs = read(); P.toast('Saved') } catch (x) { P.$('#e3', el).textContent = FB.err(x) } };
  P.$('#ts', el).onclick = async () => { const c = read(), er = P.$('#e3', el); er.textContent = ''; try { await P.mail(c, { to_email: me.email, email: me.email, code: '123456', passcode: '123456', time: new Date().toLocaleString(), title: 'Test code', name: 'AB Tech', message: 'Test email. Your admin login code would be 123456.' }); P.toast('Test email sent to ' + me.email) } catch (x) { er.textContent = 'EmailJS error: ' + String(x.message || x).slice(0, 140) } }
};

ui = P.shell({ brand: 'Admin panel', nav: NAV, user: me, profile: 'settings', events, render: (id, el, sub) => V[id](el, sub), subTitle: (id, sub) => ({ visits: 'Website visits', unique: 'Unique visitors', users: 'Users', logins: 'Logins', requests: 'Project requests', messages: 'Unread messages', projects: 'Projects' })[sub],
  search: q => { const o = []; P.arr(D.users).filter(x => (x.name + ' ' + x.email).toLowerCase().includes(q)).slice(0, 4).forEach(x => o.push({ ic: 'user', t: x.name, s: x.email, fn: () => userModal(x.id) })); P.arr(D.projects).filter(x => (x.title + ' ' + (x.desc || '')).toLowerCase().includes(q)).slice(0, 3).forEach(x => o.push({ ic: 'folder', t: x.title, s: x.ownerUid ? uname(x.ownerUid) : 'Homepage only', fn: () => pSheet(x.id) })); reqList().filter(r => (r.title + ' ' + r.name).toLowerCase().includes(q)).slice(0, 3).forEach(r => o.push({ ic: 'list', t: r.title, s: r.name, fn: () => reqModal(r.uid + '/' + r.id) })); return o } });
badges();
</script>
